<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
>
<h:head/>
<h:body>
    <h2>Candy bar selection:</h2>
    <ol>
        <ui:repeat value="#{batis_candyBars.allCandyBars}" var="candyBar">
            <li><h:link value="#{candyBar.name}" outcome="myBatis/candyBarDetails?candyBarId=#{candyBar.id}" /></li>
        </ui:repeat>
    </ol>
    <h:form>
        <h:inputText value="#{batis_candyBars.candyBarToCreate.name}" required="true" />
        <h:commandButton value="Add new candy bar" actionListener="#{batis_candyBars.createCandyBar}" action="index?faces-redirect=true"/>
    </h:form>
    <h:link outcome="myBatis/ingredientManagement" value="Manage ingredients"/>
    <br/>
    <h:link outcome="index" value="JPA implementation"/>
</h:body>
</html>
